# ScaleCart local stack.
#   docker compose up -d --build                     start everything
#   API_REPLICAS=4 docker compose up -d --build      run 4 API instances behind NGINX
#   docker compose run --rm migrate node dist/seed.js   demo data (see apps/api/src/seed.ts)
#   UIs: Swagger :8088/docs · Grafana :3001 · RabbitMQ :15672 · Mailpit (emails) :8025
#   docker compose down -v                           stop and delete all data
name: scalecart

# Database settings shared by the API and the one-off jobs.
# Secrets come from .env (never committed): copy .env.example to .env first.
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: scalecart
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_USER: scalecart
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      # Phase 8: the payments service's own login (created by infra/mysql/init/02-payments-user.sh).
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env (see .env.example)}
    command:
      # Keep the whole working set in memory, so experiments measure queries, not disk.
      - --innodb-buffer-pool-size=512M
    ports:
      # 3306 is often taken by a locally installed MySQL.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Cache + login-failure counters. Pure memory: losing it only costs extra MySQL reads.
  redis:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # When full, evict the least-recently-used keys instead of refusing writes.
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 320M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Message broker. Management UI: http://localhost:15672 (user scalecart, RABBITMQ_PASSWORD).
  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq   # RabbitMQ stores data per node name; a fixed hostname keeps it across restarts
    environment:
      RABBITMQ_DEFAULT_USER: scalecart
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      - "5672:5672"     # AMQP (apps)
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Fake mail server: catches every email. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_MESSAGES: 0          # keep everything (default deletes beyond 500), so experiments can count
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web inbox + API
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # Background process: outbox relay → RabbitMQ, email consumer, cleanup jobs.
  # Same image as the API, different entry point; no JWT secret, no public port.
  worker:
    build: ./apps/api
    image: scalecart/api:dev
    command: ["node", "dist/worker.js"]
    environment:
      <<: *db-env
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ACCESS_LOG: "false"
      RABBITMQ_URL: amqp://scalecart:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      # Orders (Phase 8): the worker settles orders from payment.captured events, and expires unpaid orders after
      # asking the payments service ("paid after all?").
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-900}
      PAYMENTS_URL: http://payments:3002
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env (see .env.example)}
      PAYMENT_JOBS_INTERVAL_SECONDS: ${PAYMENT_JOBS_INTERVAL_SECONDS:-30}
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: the worker waits and reconnects by itself.
      rabbitmq:
        condition: service_started
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1.0}"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  # One-off job: creates the module databases and applies migrations, then exits.
  migrate:
    build: ./apps/api
    image: scalecart/api:dev
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *db-env
      DB_POOL_SIZE: 1
      # Used by `docker compose run --rm migrate node dist/seed.js`.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    image: scalecart/api:dev
    environment:
      <<: *db-env
      PORT: 3000
      HTTP_ADAPTER: ${HTTP_ADAPTER:-fastify}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Off by default: per-request logs measurably reduce throughput under load.
      HTTP_ACCESS_LOG: ${HTTP_ACCESS_LOG:-false}
      LAB_ENDPOINTS: "true"
      # atomic (correct) | locking | naive (oversells) - for experiment E1 only.
      STOCK_RESERVATION: ${STOCK_RESERVATION:-atomic}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      # Node's default is 511; bursts overflowed it (E2). Capped by net.core.somaxconn (4096).
      HTTP_LISTEN_BACKLOG: ${HTTP_LISTEN_BACKLOG:-4096}
      # outbox (normal) | sync (lab: email sent inside the checkout request, experiment E3)
      NOTIFY_MODE: ${NOTIFY_MODE:-outbox}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # AI shopping assistant (Phase 3.5). Empty key = assistant off (/ai routes answer 503).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
      AI_THINKING_LEVEL: ${AI_THINKING_LEVEL:-minimal}
      AI_CHAT_PER_MINUTE: ${AI_CHAT_PER_MINUTE:-10}
      # Orders: the payment deadline is the shop's (the payments service reads it via /internal/orders/:id).
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-900}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env (see .env.example)}
      # Drops (Phase 4.6): Redis "door counter" in front of the MySQL stock row. false = every buyer goes to MySQL (E6).
      DROP_STOCK_GATE: ${DROP_STOCK_GATE:-true}
      # API-wide token-bucket rate limit (Phase 6), "capacity:refillPerSecond" per policy. Load tests send
      # everything from one IP: run the older ones with RATE_LIMIT_ENABLED=false.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-60:20}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10:0.2}
      RATE_LIMIT_CHECKOUT: ${RATE_LIMIT_CHECKOUT:-5:0.5}
      # NGINX sets X-Real-IP to the connecting address; the API is only reachable through NGINX.
      TRUST_PROXY: "true"
      # Two-step login (Phase 6b): encrypts authenticator secrets; empty = derived from JWT_SECRET.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Explicit heap cap (~75% of the memory limit) instead of V8's container-derived default.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started, not "healthy": the API works without Redis (fail open), just slower.
      redis:
        condition: service_started
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  # Phase 8: payments as its own service (apps/payments): own image, own MySQL login and database, own process.
  # NGINX routes /orders/:id/payment and /payments/* here; it talks to the shop only via events and /internal calls.
  payments-migrate:
    build: ./apps/payments
    image: scalecart/payments:dev
    command: ["node", "dist/database/migrate.js"]
    environment: &payments-db-env
      DB_HOST: mysql
      DB_PORT: 3306
      PAYMENTS_DB_USER: payments
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env (see .env.example)}
      PAYMENTS_DB_NAME: scalecart_payments
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  payments:
    build: ./apps/payments
    image: scalecart/payments:dev
    environment:
      <<: *payments-db-env
      PORT: 3002
      DB_POOL_SIZE: ${PAYMENTS_DB_POOL_SIZE:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ACCESS_LOG: ${HTTP_ACCESS_LOG:-false}
      # Verifies the shop's login tokens (verify only, same secret).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env (see .env.example)}
      SHOP_URL: http://api:3000
      SHOP_TIMEOUT_MS: ${SHOP_TIMEOUT_MS:-1000}
      RABBITMQ_URL: amqp://scalecart:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      # Razorpay lives here now (empty keys = payments off: the routes answer 503).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENT_JOBS_INTERVAL_SECONDS: ${PAYMENT_JOBS_INTERVAL_SECONDS:-30}
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    deploy:
      replicas: ${PAYMENTS_REPLICAS:-1}
      resources:
        limits:
          cpus: "${PAYMENTS_CPUS:-0.5}"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  lb:
    image: nginx:1.30.6-alpine
    ports:
      # 8080 is often taken on Windows (e.g. by an Oracle listener), so default to 8088.
      - "${LB_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/demo:/usr/share/nginx/demo:ro
      # The storefront's build output: run `npm run build` in apps/web first (see apps/web/README.md).
      - ./apps/web/dist:/usr/share/nginx/shop:ro
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  # LAB ONLY (E12): the same edge, straight to the shop without the gateway, on port 8090.
  #   docker compose --profile lab up -d lb-direct
  lb-direct:
    image: nginx:1.30.6-alpine
    profiles: [lab]
    ports:
      - "8090:80"
    volumes:
      - ./infra/nginx/nginx.direct.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  # Phase 9: API gateway (Kong, DB-less). NGINX sends every API request here; Kong checks tokens, routes to the shop or
  # payments, adds X-Request-ID and exposes its own metrics. Config: infra/kong/kong.template.yml.
  gateway:
    image: kong:3.9.4
    entrypoint: ["/bin/sh", "/kong/start.sh"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384
      # Admin API only inside the container (docker exec), for config reloads in experiments.
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      # Metrics + health for Prometheus, on the Docker network only.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: "2"
      # NGINX in front sets X-Real-IP to the caller's address; trust it (Kong is only reachable from inside Docker).
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Real-IP
      # Response headers Kong adds: only its latency split (X-Kong-Proxy-Latency / X-Kong-Upstream-Latency), no
      # "Via: kong/<version>" advertising the version.
      KONG_HEADERS: latency_tokens
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Re-ask Docker's DNS often, so a restarted shop or payments container (new IP) is found within seconds.
      KONG_DNS_STALE_TTL: "4"
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_ORDER: LAST,A,CNAME
    volumes:
      - ./infra/kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Lets k6 push its own metrics so client- and server-side views share one dashboard.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      # Local lab only: open access, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scalecart-overview.json
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
