# LAB ONLY (compose profile "lab", port 8090): the same edge as nginx.conf, but straight to the shop, skipping the
# gateway. Used by experiment E12 to compare "with Kong" and "without Kong" on the same stack. Never expose it.
worker_processes auto;

events {
  worker_connections 10240;
}

http {
  access_log off;
  limit_req_zone $http_authorization zone=per_token:20m rate=50r/s;
  limit_req_status 429;

  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api:3000 resolve;
    keepalive 128;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      limit_req zone=per_token burst=100 nodelay;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
