global:
  # Short intervals so load-test charts show changes within seconds.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Docker's DNS returns one record per replica, so every API instance is scraped.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 5s

  # Background workers: outbox backlog, emails sent, end-to-end notification delay.
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 3001
        refresh_interval: 5s

  # Phase 8: the payments service (its own process and metrics).
  - job_name: payments
    dns_sd_configs:
      - names: [payments]
        type: A
        port: 3002
        refresh_interval: 5s

  # Phase 11: the identity service (logins: Argon2 time, 2FA, rate limits).
  - job_name: identity
    dns_sd_configs:
      - names: [identity]
        type: A
        port: 3003
        refresh_interval: 5s

  # Phase 9: the API gateway (Kong's status listener). Per-route requests, Kong's own latency vs the service's.
  - job_name: gateway
    static_configs:
      - targets: [gateway:8100]

  # RabbitMQ's built-in Prometheus plugin: queue depths, message rates.
  - job_name: rabbitmq
    # Per-queue numbers (the default endpoint sums all queues together).
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
