global:
  # Short intervals so load-test charts show changes within seconds.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Docker's DNS returns one record per replica, so every API instance is scraped.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 3000
        refresh_interval: 5s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
