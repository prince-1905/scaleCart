# ScaleCart local stack.
#   docker compose up -d --build                     start everything
#   API_REPLICAS=4 docker compose up -d --build      run 4 API instances behind NGINX
#   docker compose down -v                           stop and delete all data
name: scalecart

services:
  api:
    build: ./apps/api
    image: scalecart/api:dev
    environment:
      PORT: 3000
      HTTP_ADAPTER: ${HTTP_ADAPTER:-fastify}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Off by default: per-request logs measurably reduce throughput under load.
      HTTP_ACCESS_LOG: ${HTTP_ACCESS_LOG:-false}
      LAB_ENDPOINTS: "true"
      # Explicit heap cap (~75% of the memory limit) instead of V8's container-derived default.
      NODE_OPTIONS: --max-old-space-size=384
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  lb:
    image: nginx:1.30.6-alpine
    ports:
      # 8080 is often taken on Windows (e.g. by an Oracle listener), so default to 8088.
      - "${LB_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Lets k6 push its own metrics so client- and server-side views share one dashboard.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      # Local lab only: open access, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scalecart-overview.json
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
