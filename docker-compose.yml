# ScaleCart local stack.
#   docker compose up -d --build                     start everything
#   API_REPLICAS=4 docker compose up -d --build      run 4 API instances behind NGINX
#   docker compose run --rm migrate node dist/seed.js   demo data (see apps/api/src/seed.ts)
#   docker compose down -v                           stop and delete all data
name: scalecart

# Database settings shared by the API and the one-off jobs.
# Local-lab credentials only: real deployments inject secrets, never commit them.
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: scalecart
  DB_PASSWORD: ${DB_PASSWORD:-scalecart-dev-password}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
      MYSQL_USER: scalecart
      MYSQL_PASSWORD: ${DB_PASSWORD:-scalecart-dev-password}
    command:
      # Keep the whole working set in memory, so experiments measure queries, not disk.
      - --innodb-buffer-pool-size=512M
    ports:
      # 3306 is often taken by a locally installed MySQL.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # One-off job: creates the module databases and applies migrations, then exits.
  migrate:
    build: ./apps/api
    image: scalecart/api:dev
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *db-env
      DB_POOL_SIZE: 1
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    image: scalecart/api:dev
    environment:
      <<: *db-env
      PORT: 3000
      HTTP_ADAPTER: ${HTTP_ADAPTER:-fastify}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Off by default: per-request logs measurably reduce throughput under load.
      HTTP_ACCESS_LOG: ${HTTP_ACCESS_LOG:-false}
      LAB_ENDPOINTS: "true"
      # atomic (correct) | locking | naive (oversells) - for experiment E1 only.
      STOCK_RESERVATION: ${STOCK_RESERVATION:-atomic}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      # Explicit heap cap (~75% of the memory limit) instead of V8's container-derived default.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  lb:
    image: nginx:1.30.6-alpine
    ports:
      # 8080 is often taken on Windows (e.g. by an Oracle listener), so default to 8088.
      - "${LB_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Lets k6 push its own metrics so client- and server-side views share one dashboard.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      # Local lab only: open access, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scalecart-overview.json
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
