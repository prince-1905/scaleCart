# Load balancer in front of the API replicas.
worker_processes auto;

events {
  worker_connections 10240;
}

http {
  # Access logs at load-test rates cost CPU and disk; metrics come from Prometheus instead.
  access_log off;

  # Content types for the demo's static files. Without this, demo.css was served as
  # text/plain and browsers ignored it (the page showed unstyled).
  include /etc/nginx/mime.types;

  # "api" resolves to every replica's IP when NGINX starts; requests are round-robined.
  # After changing the replica count, restart this container so it re-resolves.
  upstream api {
    server api:3000;
    # Reuse connections to the app instead of opening one per request.
    keepalive 128;
  }

  server {
    listen 80;

    # Served by NGINX itself, never touching Node. Used to measure the ceiling of
    # the load generator + network path (experiment E0).
    location = /static-ok {
      default_type application/json;
      return 200 '{"ok":true}';
    }

    # Demo page (apps/demo): static files, same address as the API, so no CORS is needed.
    location = /demo {
      return 301 /demo/;
    }
    location /demo/ {
      alias /usr/share/nginx/demo/;
      # Plain files that change while developing: always revalidate.
      add_header Cache-Control "no-cache";
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }

    # AI chat: one message may take several model calls (up to ~75 s worst case), and
    # replies are streamed, so NGINX must pass each chunk on at once instead of buffering.
    location /ai/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 90s;
      proxy_buffering off;
    }
  }
}
