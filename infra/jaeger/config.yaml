# Jaeger 2 (all-in-one) for ScaleCart, Phase 10. Same as Jaeger's built-in default, except:
#   - keeps at most 20,000 traces in memory: under load tests the default (100,000) grew towards the container's
#     1 GB limit (634 MB after ~10 minutes of 300 req/s, E13)
#   - only what we use: OTLP over HTTP in (4318), the UI/API out (16686)
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 20000
  jaeger_query:
    storage:
      traces: memstore
    http:
      endpoint: 0.0.0.0:16686

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
