# Load balancer in front of the API replicas.
worker_processes auto;

events {
  worker_connections 10240;
}

http {
  # Access logs at load-test rates cost CPU and disk; metrics come from Prometheus instead.
  access_log off;

  # "api" resolves to every replica's IP when NGINX starts; requests are round-robined.
  # After changing the replica count, restart this container so it re-resolves.
  upstream api {
    server api:3000;
    # Reuse connections to the app instead of opening one per request.
    keepalive 128;
  }

  server {
    listen 80;

    # Served by NGINX itself, never touching Node. Used to measure the ceiling of
    # the load generator + network path (experiment E0).
    location = /static-ok {
      default_type application/json;
      return 200 '{"ok":true}';
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}
